<div class="admin-container">

  <div class="navbar">

    <h2>Admin Panel</h2>

    <button
      mat-raised-button
      color="warn"
      (click)="logout()">

      Logout

    </button>

  </div>

  <div class="content">

    <mat-card class="admin-card">

      <div class="header">

        <h2>User Management</h2>

        <button
          mat-raised-button
          color="primary"
          (click)="addUser()">

          Add Dummy User

        </button>

      </div>

      <table>

        <thead>

          <tr>

            <th>ID</th>
            <th>User ID</th>
            <th>Role</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let user of users">

            <td>{{ user.id }}</td>

            <td>{{ user.userid }}</td>

            <td>{{ user.role }}</td>

            <td>

              <button
                mat-raised-button
                color="warn"
                (click)="deleteUser(user.id)">

                Delete

              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </mat-card>

  </div>

</div>
