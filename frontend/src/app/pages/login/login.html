<div class="login-container">

  <mat-card class="login-card">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Angular Admin Portal
    </p>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>User ID</mat-label>

      <input
        matInput
        placeholder="Enter User ID"
        [(ngModel)]="userid">

    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>Password</mat-label>

      <input
        matInput
        type="password"
        placeholder="Enter Password"
        [(ngModel)]="password">

    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>Role</mat-label>

      <mat-select [(ngModel)]="role">

        <mat-option value="General User">
          General User
        </mat-option>

        <mat-option value="Admin">
          Admin
        </mat-option>

      </mat-select>

    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      class="full-width login-btn"
      (click)="login()">

      Login

    </button>

    <div
      *ngIf="loading"
      style="
        display:flex;
        justify-content:center;
        margin-top:20px;
      ">

      <mat-spinner diameter="40"></mat-spinner>

    </div>

  </mat-card>

</div>
