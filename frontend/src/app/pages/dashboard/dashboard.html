<div class="dashboard-container">

  <div class="navbar">

    <h2>Angular Admin Portal</h2>

    <button
      mat-raised-button
      color="warn"
      (click)="logout()">

      Logout

    </button>

  </div>

  <div class="content">

    <mat-card class="welcome-card">

      <h1>Welcome {{ user.role }}</h1>

      <p>
        User ID: {{ user.userid }}
      </p>

    </mat-card>

    <mat-card class="table-card">

      <h2>User Records</h2>

      <p
        *ngIf="loading"
        style="margin-top:20px;">

        Loading records from server...

      </p>

      <table *ngIf="!loading">

        <thead>

          <tr>

            <th>ID</th>
            <th>Department</th>
            <th>Access</th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let record of records">

            <td>{{ record.id }}</td>

            <td>{{ record.department }}</td>

            <td>{{ record.access }}</td>

          </tr>

        </tbody>

      </table>

    </mat-card>

  </div>

  <footer class="footer">

    Developed by Sabari Balaji

  </footer>

</div>
